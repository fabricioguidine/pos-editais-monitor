name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv pip install --system -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check)
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src

  test-unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv pip install --system -e ".[dev]"
      - name: Pytest (unit)
        run: pytest tests/unit -m "not integration and not contract" --cov=pos_editais_monitor --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: lint-type
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pem
          POSTGRES_PASSWORD: pem
          POSTGRES_DB: pem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PEM_DATABASE_URL: postgresql+asyncpg://pem:pem@localhost:5432/pem
      PEM_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv pip install --system -e ".[dev]"
      - name: Migrations
        run: alembic upgrade head
      - name: Pytest (integration)
        run: pytest tests/integration -m integration

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: pos-editais-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
