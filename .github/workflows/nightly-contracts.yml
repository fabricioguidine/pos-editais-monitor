name: nightly-contracts

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 02:00 BRT
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"
      - name: Contract tests (network)
        run: pytest tests/contracts -m contract -v
        continue-on-error: true
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly] Contract tests failed on ${new Date().toISOString().slice(0,10)}`,
              body: "Contract tests against real upstreams failed. Likely upstream drift. Investigate the affected spider."
            })
