[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pos-editais-monitor"
version = "0.1.0"
description = "Monitoramento automatizado de editais de pos-graduacao gratuitos no Brasil"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabricio Guidine", email = "fabricioguidine@gmail.com" }]
keywords = ["scraping", "pos-graduacao", "editais", "capes", "uab", "fastapi", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  # Web / API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  # HTTP / scraping
  "httpx[http2]>=0.27",
  "tenacity>=9.0",
  "playwright>=1.48",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "selectolax>=0.3.21",
  "urllib3>=2.2",
  "protego>=0.3",  # robots.txt parser
  # PDF
  "pdfplumber>=0.11",
  "pypdf>=5.1",
  # DB
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",  # for alembic sync ops
  # Cache / queue
  "redis>=5.2",
  # Scheduling
  "apscheduler>=3.10",
  # Notifications
  "aiogram>=3.13",  # Telegram
  "aiosmtplib>=3.0",
  "jinja2>=3.1",
  # LLM (fallback parser)
  "anthropic>=0.39",
  # Dedup / NLP utils
  "simhash>=2.1",
  "rapidfuzz>=3.10",
  "unidecode>=1.3",
  # Observability
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b2",
  "opentelemetry-instrumentation-httpx>=0.49b2",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b2",
  "prometheus-client>=0.21",
  # CLI
  "typer>=0.13",
  "rich>=13.9",
  # Misc
  "python-dateutil>=2.9",
  "babel>=2.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "pytest-httpx>=0.34",
  "respx>=0.21",
  "factory-boy>=3.3",
  "freezegun>=1.5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
  "pre-commit>=4.0",
  "hypothesis>=6.119",
]

[project.scripts]
pem = "pos_editais_monitor.cli.main:app"

[project.urls]
Homepage = "https://github.com/fabricioguidine/pos-editais-monitor"
Issues = "https://github.com/fabricioguidine/pos-editais-monitor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pos_editais_monitor"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "C4",       # comprehensions
  "UP",       # pyupgrade
  "SIM",      # simplify
  "PL",       # pylint
  "RUF",      # ruff-specific
  "ASYNC",    # async issues
  "S",        # bandit
  "TID",      # tidy imports
]
ignore = [
  "PLR0913",  # many arguments
  "PLR2004",  # magic value
  "S101",     # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "ASYNC"]
"src/pos_editais_monitor/infrastructure/db/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pdfplumber.*",
  "simhash.*",
  "apscheduler.*",
  "aiosmtplib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --cov=pos_editais_monitor --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires real services (db, redis)",
  "contract: tests against real upstream sources (network)",
  "slow: deselect with '-m \"not slow\"'",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:playwright.*",
]

[tool.coverage.run]
branch = true
source = ["src/pos_editais_monitor"]
omit = [
  "*/migrations/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
